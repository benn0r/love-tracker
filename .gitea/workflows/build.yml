name: Build

on:
  push:
    branches:
      - "**"
    tags:
      - "**"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest-slim
    container: node:22.13.0-bookworm
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate source
        run: |
          node --check server.js
          node --check test/server.test.js
          node --check test/e2e.test.js

      - name: Package immutable build context
        run: |
          tar \
            --exclude=.git \
            --exclude=data \
            --exclude=build-context.tar.gz \
            -czf build-context.tar.gz .

      - name: Upload build context
        uses: actions/upload-artifact@v3
        with:
          name: build-context
          path: build-context.tar.gz
          retention-days: 7

  test:
    needs: build
    runs-on: ubuntu-latest-slim
    container: node:22.13.0-bookworm
    timeout-minutes: 15

    steps:
      - name: Download build context
        uses: actions/download-artifact@v3
        with:
          name: build-context

      - name: Extract build context
        run: |
          mkdir source
          tar -xzf build-context.tar.gz -C source

      - name: Run unit tests
        working-directory: source
        run: node --test --test-reporter=junit --test-reporter-destination=unit-results.xml test/server.test.js

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: unit-test-results
          path: source/unit-results.xml
          retention-days: 14

  test-e2e:
    needs: test
    runs-on: ubuntu-latest-slim
    container: node:22.13.0-bookworm
    timeout-minutes: 15

    steps:
      - name: Download build context
        uses: actions/download-artifact@v3
        with:
          name: build-context

      - name: Download unit test results
        uses: actions/download-artifact@v3
        with:
          name: unit-test-results
          path: test-evidence/unit

      - name: Extract build context
        run: |
          mkdir source
          tar -xzf build-context.tar.gz -C source

      - name: Run end-to-end tests
        working-directory: source
        run: node --test --test-reporter=junit --test-reporter-destination=e2e-results.xml test/e2e.test.js

      - name: Upload end-to-end test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: e2e-test-results
          path: |
            source/e2e-results.xml
            test-evidence/unit/unit-results.xml
          retention-days: 14

  publish-image:
    if: gitea.event_name == 'push' && startsWith(gitea.ref, 'refs/heads/')
    needs: test-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download validated build context
        uses: actions/download-artifact@v3
        with:
          name: build-context

      - name: Download test evidence
        uses: actions/download-artifact@v3
        with:
          name: e2e-test-results
          path: test-evidence

      - name: Extract validated build context
        run: |
          mkdir source
          tar -xzf build-context.tar.gz -C source

      - name: Install Docker CLI
        shell: sh
        run: |
          apt-get update
          apt-get install --yes curl docker.io jq
          docker version

      - name: Log in to Gitea Container Registry
        shell: sh
        env:
          GITEA_SERVER_URL: ${{ gitea.server_url }}
          REGISTRY_USERNAME: ${{ gitea.repository_owner }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          registry="${GITEA_SERVER_URL#https://}"
          registry="${registry#http://}"
          printf '%s' "${REGISTRY_TOKEN}" \
            | docker login "${registry}" --username "${REGISTRY_USERNAME}" --password-stdin

      - name: Build and push image
        shell: sh
        env:
          GITEA_SERVER_URL: ${{ gitea.server_url }}
          IMAGE_REPOSITORY: ${{ gitea.repository }}
          IMAGE_BRANCH: ${{ gitea.ref_name }}
        run: |
          registry="${GITEA_SERVER_URL#https://}"
          registry="${registry#http://}"
          image="${registry}/${IMAGE_REPOSITORY}"
          branch_tag="$(printf '%s' "${IMAGE_BRANCH}" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's#[^a-z0-9_.-]#-#g')"

          docker build --tag "${image}:${branch_tag}" source
          docker push "${image}:${branch_tag}"

      - name: Remove obsolete package versions
        if: gitea.ref == 'refs/heads/main'
        shell: sh
        env:
          GITEA_SERVER_URL: ${{ gitea.server_url }}
          PACKAGE_OWNER: ${{ gitea.repository_owner }}
          PACKAGE_NAME: ${{ gitea.event.repository.name }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          versions="$(curl --fail --silent --show-error \
            --header "Authorization: token ${REGISTRY_TOKEN}" \
            "${GITEA_SERVER_URL}/api/v1/packages/${PACKAGE_OWNER}?type=container&q=${PACKAGE_NAME}&limit=100")"

          printf '%s' "${versions}" \
            | jq -r '.[] | select(.name == env.PACKAGE_NAME and .version != "main") | .version' \
            | while IFS= read -r version; do
                status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
                  --request DELETE \
                  --header "Authorization: token ${REGISTRY_TOKEN}" \
                  "${GITEA_SERVER_URL}/api/v1/packages/${PACKAGE_OWNER}/container/${PACKAGE_NAME}/${version}")"
                [ "${status}" = "204" ] || [ "${status}" = "404" ]
              done
