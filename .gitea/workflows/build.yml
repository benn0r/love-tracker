name: Build

on:
  push:
    branches:
      - "**"
    tags:
      - "**"
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest-slim
    container: node:22.13.0-bookworm
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Test
        run: npm test

  publish-image:
    if: gitea.event_name == 'push' && startsWith(gitea.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Docker CLI
        shell: sh
        run: |
          apt-get update
          apt-get install --yes curl docker.io jq
          docker version

      - name: Log in to Gitea Container Registry
        uses: docker/login-action@v3
        with:
          registry: git.example.com
          username: benn0r
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build and push image
        shell: sh
        env:
          IMAGE_BRANCH: ${{ gitea.ref_name }}
        run: |
          image="git.example.com/benn0r/love-tracker"
          branch_tag="$(printf '%s' "${IMAGE_BRANCH}" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's#[^a-z0-9_.-]#-#g')"

          docker build --tag "${image}:${branch_tag}" .
          docker push "${image}:${branch_tag}"

      - name: Remove obsolete package versions
        if: gitea.ref == 'refs/heads/main'
        shell: sh
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          versions="$(curl --fail --silent --show-error \
            --header "Authorization: token ${REGISTRY_TOKEN}" \
            "https://git.example.com/api/v1/packages/benn0r?type=container&q=love-tracker&limit=100")"

          printf '%s' "${versions}" \
            | jq -r '.[] | select(.name == "love-tracker" and .version != "main") | .version' \
            | while IFS= read -r version; do
                status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
                  --request DELETE \
                  --header "Authorization: token ${REGISTRY_TOKEN}" \
                  "https://git.example.com/api/v1/packages/benn0r/container/love-tracker/${version}")"
                [ "${status}" = "204" ] || [ "${status}" = "404" ]
              done
