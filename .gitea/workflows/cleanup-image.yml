name: Clean up branch image

on:
  delete:
  pull_request:
    types:
      - closed

jobs:
  deleted-branch:
    if: gitea.event_name == 'delete' && gitea.event.ref_type == 'branch'
    runs-on: ubuntu-latest-slim
    steps:
      - name: Install curl
        run: |
          apt-get update
          apt-get install --yes curl

      - name: Delete branch image tag
        shell: sh
        env:
          BRANCH_NAME: ${{ gitea.event.ref }}
          GITEA_SERVER_URL: ${{ gitea.server_url }}
          PACKAGE_OWNER: ${{ gitea.repository_owner }}
          PACKAGE_NAME: ${{ gitea.event.repository.name }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          branch_name="${BRANCH_NAME#refs/heads/}"
          branch_tag="$(printf '%s' "${branch_name}" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's#[^a-z0-9_.-]#-#g')"
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request DELETE \
            --header "Authorization: token ${REGISTRY_TOKEN}" \
            "${GITEA_SERVER_URL}/api/v1/packages/${PACKAGE_OWNER}/container/${PACKAGE_NAME}/${branch_tag}")"
          [ "${status}" = "204" ] || [ "${status}" = "404" ]

  merged-branch:
    if: gitea.event_name == 'pull_request' && gitea.event.pull_request.merged == true
    runs-on: ubuntu-latest-slim
    steps:
      - name: Install curl
        run: |
          apt-get update
          apt-get install --yes curl

      - name: Delete merged branch image tag
        shell: sh
        env:
          BRANCH_NAME: ${{ gitea.event.pull_request.head.ref }}
          GITEA_SERVER_URL: ${{ gitea.server_url }}
          PACKAGE_OWNER: ${{ gitea.repository_owner }}
          PACKAGE_NAME: ${{ gitea.event.repository.name }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          branch_name="${BRANCH_NAME#refs/heads/}"
          branch_tag="$(printf '%s' "${branch_name}" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's#[^a-z0-9_.-]#-#g')"
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request DELETE \
            --header "Authorization: token ${REGISTRY_TOKEN}" \
            "${GITEA_SERVER_URL}/api/v1/packages/${PACKAGE_OWNER}/container/${PACKAGE_NAME}/${branch_tag}")"
          [ "${status}" = "204" ] || [ "${status}" = "404" ]
